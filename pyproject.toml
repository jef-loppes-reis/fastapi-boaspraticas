[project]
name = "fastapi-boaspraticas"
version = "0.1.0"
description = ""
authors = [
    {name = "jef-loppes-reis",email = "jefersondip25@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.5,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.ruff]
line-length = 79 # Define a quantidade de caracteres (colunas) por linha
preview = true
extend-exclude = ['migrations']
lint.select = [
    'I', # (Isort): ordenacao de imports em ordem alfabetica;
    'F', # (Pyflakes): procura por alguns erros em relacao a boas praticas de codigo;
    'E', # (pycodestyle): erros de estido de codigo;
    'W', # (pycodestyle): avisos sobre estilo de codigo;
    'PL', # (Pylint): "erros" em relacao a boas praticas de codigo;
    'PT' # (flake8-pytest): boas praticas do Pytest;
]

[tool.ruff.format]
preview = true
quote-style = 'single' # Estilo de aspas, simples.

[tool.pytest.ini_options]
pythonpath = '.'
addopts = '-p no:warnings'

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev .\fastapi_boaspraticas\app.py'

pre_test = 'task lint'
test = 'pytest -s -x --cov=fastapi_boaspraticas -vv'
post_test = 'coverage html'
